<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="-apple-system, 'Inter', BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="duo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F6E56"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1D21"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6066"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1D21" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="920" fill="#F1EFE8"/>

  <!-- Title -->
  <text x="60" y="62" fill="#5C6066" font-size="12" letter-spacing="3" font-weight="500">TESSERA · ARCHITECTURE</text>
  <text x="60" y="98" fill="#1A1D21" font-size="34" font-weight="600" letter-spacing="-0.5">Dos universos. Una sola identidad on-chain.</text>
  <line x1="60" y1="118" x2="240" y2="118" stroke="#0F6E56" stroke-width="2"/>

  <!-- ── Layer 1 · USER WALLET ─────────────────────────────── -->
  <g transform="translate(0, 160)">
    <text x="60" y="0" fill="#5C6066" font-size="10" letter-spacing="2" font-weight="500">01 · ENTRY</text>
    <rect x="380" y="20" width="440" height="64" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5" filter="url(#shadow)"/>
    <text x="600" y="48" text-anchor="middle" fill="#1A1D21" font-size="15" font-weight="600">User wallet</text>
    <text x="600" y="68" text-anchor="middle" fill="#5C6066" font-size="11" font-family="ui-monospace, 'JetBrains Mono', monospace">Core · MetaMask · WalletConnect (RainbowKit + wagmi)</text>
    <!-- arrow down -->
    <line x1="600" y1="84" x2="600" y2="124" stroke="#1A1D21" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- ── Layer 2 · IDENTITY (shared) ─────────────────────────────── -->
  <g transform="translate(0, 304)">
    <text x="60" y="0" fill="#5C6066" font-size="10" letter-spacing="2" font-weight="500">02 · IDENTITY · SHARED</text>
    <rect x="280" y="20" width="640" height="78" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="280" y="20" width="6" height="78" fill="#0F6E56" rx="2"/>
    <text x="304" y="48" fill="#0F6E56" font-size="11" font-weight="600" letter-spacing="1">IDENTITYREGISTRY · ERC-3643</text>
    <text x="304" y="72" fill="#1A1D21" font-size="15" font-weight="600">Una KYC. Diez tokens. Ambos universos.</text>
    <text x="304" y="90" fill="#5C6066" font-size="11" font-family="ui-monospace, monospace">addIdentity(addr, country) · isVerified(addr) · removeIdentity(addr)</text>
    <!-- right-side note -->
    <text x="940" y="60" fill="#5C6066" font-size="11">attested on-chain</text>
    <text x="940" y="76" fill="#5C6066" font-size="11">no PDFs, no re-onboard</text>
    <!-- arrows down to the two compliance branches -->
    <line x1="500" y1="98" x2="500" y2="140" stroke="#1A1D21" stroke-width="1.5"/>
    <line x1="500" y1="140" x2="320" y2="140" stroke="#1A1D21" stroke-width="1.5"/>
    <line x1="500" y1="140" x2="880" y2="140" stroke="#1A1D21" stroke-width="1.5"/>
    <line x1="320" y1="140" x2="320" y2="172" stroke="#1A1D21" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="880" y1="140" x2="880" y2="172" stroke="#1A1D21" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- ── Layer 3 · COMPLIANCE / TOKENS (split) ─────────────────────────────── -->
  <g transform="translate(0, 484)">
    <text x="60" y="0" fill="#5C6066" font-size="10" letter-spacing="2" font-weight="500">03 · COMPLIANCE · PER-TOKEN</text>

    <!-- Private box -->
    <rect x="120" y="20" width="400" height="118" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5" filter="url(#shadow)"/>
    <rect x="120" y="20" width="6" height="118" fill="#0F6E56" rx="2"/>
    <text x="144" y="48" fill="#0F6E56" font-size="11" font-weight="600" letter-spacing="1">PRIVATE UNIVERSE · × 4</text>
    <text x="144" y="72" fill="#1A1D21" font-size="15" font-weight="600">SecurityToken (LatAm equity)</text>
    <text x="144" y="92" fill="#5C6066" font-size="11" font-family="ui-monospace, monospace">_update() → IdentityRegistry.isVerified(to)</text>
    <text x="144" y="124" fill="#1A1D21" font-size="12" font-family="ui-monospace, monospace" font-weight="500">KVK  ·  BTS  ·  CLP  ·  ARK1</text>

    <!-- Public box -->
    <rect x="680" y="20" width="400" height="118" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5" filter="url(#shadow)"/>
    <rect x="680" y="20" width="6" height="118" fill="#3C3489" rx="2"/>
    <text x="704" y="48" fill="#3C3489" font-size="11" font-weight="600" letter-spacing="1">PUBLIC UNIVERSE · × 6</text>
    <text x="704" y="72" fill="#1A1D21" font-size="15" font-weight="600">SecurityToken (US equity mirror)</text>
    <text x="704" y="92" fill="#5C6066" font-size="11" font-family="ui-monospace, monospace">_update() → IdentityRegistry.isVerified(to)</text>
    <text x="704" y="124" fill="#1A1D21" font-size="12" font-family="ui-monospace, monospace" font-weight="500">AAPL · MSFT · NVDA · GOOGL · AMZN · META</text>

    <!-- arrows down to shared orderbook -->
    <line x1="320" y1="138" x2="320" y2="160" stroke="#1A1D21" stroke-width="1.5"/>
    <line x1="880" y1="138" x2="880" y2="160" stroke="#1A1D21" stroke-width="1.5"/>
    <line x1="320" y1="160" x2="600" y2="160" stroke="#1A1D21" stroke-width="1.5"/>
    <line x1="880" y1="160" x2="600" y2="160" stroke="#1A1D21" stroke-width="1.5"/>
    <line x1="600" y1="160" x2="600" y2="192" stroke="#1A1D21" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- ── Layer 4 · TRADING (shared) ─────────────────────────────── -->
  <g transform="translate(0, 696)">
    <text x="60" y="0" fill="#5C6066" font-size="10" letter-spacing="2" font-weight="500">04 · TRADING · SHARED</text>
    <rect x="280" y="20" width="640" height="78" rx="10" fill="#FFFFFF" stroke="url(#duo)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="304" y="48" fill="#1A1D21" font-size="11" font-weight="600" letter-spacing="1">ORDERBOOK · ESCROW · 0.3% FEE</text>
    <text x="304" y="72" fill="#1A1D21" font-size="15" font-weight="600">Un solo contrato sirve Private + Public</text>
    <text x="304" y="90" fill="#5C6066" font-size="11" font-family="ui-monospace, monospace">placeOrder · fillOrder · cancelOrder · getOrdersForToken</text>
    <text x="940" y="60" fill="#5C6066" font-size="11">limit orders, no AMM</text>
    <text x="940" y="76" fill="#5C6066" font-size="11">atomic fill, pull-style</text>

    <!-- arrow down to settlement -->
    <line x1="380" y1="98" x2="380" y2="140" stroke="#1A1D21" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- ── Layer 5 · SETTLEMENT + MONITORING ─────────────────────────────── -->
  <g transform="translate(0, 856)">
    <text x="60" y="0" fill="#5C6066" font-size="10" letter-spacing="2" font-weight="500">05 · SETTLEMENT · MONITORING</text>
    <!-- Settlement -->
    <rect x="280" y="-178" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
    <text x="296" y="-155" fill="#5C6066" font-size="10" letter-spacing="1.5" font-weight="600">SETTLEMENT</text>
    <text x="296" y="-135" fill="#1A1D21" font-size="13" font-weight="500">MockUSDC · 6 decimals</text>

    <!-- Monitoring (right) -->
    <rect x="640" y="-178" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#3C3489" stroke-width="1"/>
    <text x="656" y="-155" fill="#3C3489" font-size="10" letter-spacing="1.5" font-weight="600">MONITORING · OFF-CHAIN</text>
    <text x="656" y="-135" fill="#1A1D21" font-size="13" font-weight="500">Wavy Node → /admin/reports</text>

    <!-- Arrow from Wavy to IdentityRegistry (loops back up — depicted as a curve label) -->
    <text x="640" y="-100" fill="#5C6066" font-size="10" font-style="italic">MX · CO · SV · GT — auto-generated regulatory reports</text>
  </g>

  <!-- Data source annotations (top-right corner) -->
  <g transform="translate(900, 160)">
    <rect x="0" y="0" width="240" height="100" rx="8" fill="rgba(15,110,86,0.04)" stroke="#D3D1C7" stroke-width="0.5"/>
    <text x="14" y="22" fill="#5C6066" font-size="10" letter-spacing="1.5" font-weight="600">DATA SOURCES</text>
    <text x="14" y="46" fill="#1A1D21" font-size="11" font-family="ui-monospace, monospace">private  →  on-chain only</text>
    <text x="14" y="68" fill="#1A1D21" font-size="11" font-family="ui-monospace, monospace">public   →  Dinari sandbox</text>
    <text x="14" y="86" fill="#5C6066" font-size="10" font-style="italic">(SEC-compliant US equity bridge)</text>
  </g>

  <!-- Footer note -->
  <text x="60" y="900" fill="#5C6066" font-size="10" font-family="ui-monospace, monospace">Avalanche Fuji · chainId 43113 · ERC-3643-inspired SecurityToken · OpenZeppelin v5 base</text>
</svg>
